name: matchx_auth
description: MatchX Dating App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.0.0
  image_picker: ^1.0.4
  google_sign_in: ^6.1.5  # ← Add this for Google Sign-In

  geolocator: ^10.1.0        # For GPS location
  geocoding: ^2.1.1          # For address conversion
  http: ^1.1.0               # For API calls
  flutter_dotenv: ^5.1.0    # For loading credentials from .env file

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/matchxp_logo.png
    - .env
