name: matchx_auth
description: MatchX Dating App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.0.0
  image_picker: ^1.0.4
  google_sign_in: ^6.1.5
  url_launcher: ^6.2.0
  record: ^5.1.2
  path_provider: ^2.1.0

  geolocator: ^10.1.0        # For GPS location
  geocoding: ^2.1.1          # For address conversion
  http: ^1.1.0               # For API calls
  flutter_dotenv: ^5.1.0    # For loading credentials from .env file
  shared_preferences: ^2.2.2 # For persisting theme preference
  google_fonts: ^6.1.0       # For Emoji Charades UI
  confetti: ^0.7.0           # For Emoji Charades win animation
  audioplayers: ^5.2.1       # For voice message playback
  flutter_svg: ^2.0.10+1    # For SVG logo rendering

dependency_overrides:
  record_linux:
    path: local_packages/record_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/matchxp_logo.png
    - .env
